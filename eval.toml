# Martuni — Eval-Parameter (Centipawns)
#
# Diese Datei ist die Stellschraube zum Tuning der Engine.
# Kommentare und freie Formatierung sind erlaubt; die Engine laedt
# die Werte beim Start (oder nach Neustart) neu.
#
# Review-Hinweis: Die "Finding:"-Kommentare unten markieren Tuning-Kandidaten
# und die Richtung, in die ich als naechstes testen wuerde. Die gesetzten
# Werte bleiben dabei bewusst unveraendert.

[material]
# Statische Anker-Werte. Werden weiterhin gelesen von:
#   - king_exposure_penalty (NPM-Schwelle 1500 cp)
#   - endgame::strong_material (Endspiel-Klassifizierung)
# Hier nichts anfassen, sonst bewegt sich der Eval-Anker an mehreren
# Stellen gleichzeitig und A/B-Messungen werden unklar. Dynamische
# Figurenbewertung läuft separat über [material_dynamic] unten.
pawn   = 100
knight = 300
bishop = 300
rook   = 500
queen  = 900

[material_dynamic]
# Experimenteller Schritt 1 der dynamischen Figurenbewertung (10.05.2026).
#
# Idee (Kaufman 1999 + offene Beobachtung): Springer ist im Mittelspiel
# wegen taktischer Bauern-Kooperation marginal stärker, der Läufer im
# Endspiel wegen Reichweite und Freibauern-Begleitung deutlich stärker.
# Die N–B-Differenz "kippt" über die Phase.
#
# Wirkung: nur im Per-Figur-Materialscore von evaluate_side, getapert
# zwischen MG (phase=24) und EG (phase=0) wie die übrigen Tapering-Terme.
# Andere Eval-Stellen (king_exposure, endgame.rs) lesen weiter [material]
# oben — bewusste Trennung, damit der A/B-Test sauber ist.
#
# Werte:
#   - knight_mg=310: +10 cp leichter Mittelspiel-Vorzug für Springer.
#   - knight_eg=290: -10 cp schwächer im Endspiel.
#   - bishop_mg=305: leicht stärker als Default, vor allem in offenen
#     Stellungen — der reine Wert ist noch konservativ; der echte
#     Läufer-Vorteil im Endspiel kommt aus bishop_eg.
#   - bishop_eg=320: +20 cp Endspiel — deutlichster Effekt-Treiber.
# Symmetrie: Springer verliert 20 cp über die Phase, Läufer gewinnt 15 cp.
# N–B-Differenz: MG +5 (≈null), EG -30 (klar Läufer) — Kaufman-konsistent.
#
# Defaults im Code sind 300/300/300/300 (verhaltensgleich mit alter Eval).
# Wenn diese Sektion gelöscht oder auskommentiert wird, fällt die Engine
# auf statische 300/300 zurück und verhält sich wie das Baseline-Binary.
knight_mg = 310
knight_eg = 290
bishop_mg = 305
bishop_eg = 320

# Schritt 2 der dynamischen Figurenbewertung (12.05.2026): Pawn-Adjustment.
# Aktiviert zusätzlich zum MG/EG-Tapering eine bauernabhängige Skalierung
# der Springer- und Läuferbewertung im Per-Figur-Materialscore.
#
# Formeln in eval::piece_material:
#   knight_adj = (own_pawns  -  8) * knight_pawn_scale   (-24..0 cp)
#   bishop_adj = (16 - total_pawns) * bishop_pawn_scale  (  0..+64 cp)
#
# Intuition:
#   - Springer braucht eigene Bauern als Hilfsstruktur (Outposts, taktische
#     Kooperation). Weniger eigene Bauern → Springer verliert Wirkung.
#   - Läufer braucht freie Diagonalen. Weniger Bauern insgesamt auf dem
#     Brett → Läufer gewinnt Wirkung. Stützt sich auf total_pawns (analog
#     zur Läuferpaar-Logik in Schritt 3, die später dazukommt).
#
# Werte 3/4 sind Kaufman-konservative Hausnummern. Im Schritt 2 explizit
# nur dieser eine Hebel — Step 3 (dynamisches Läuferpaar) bleibt parkiert
# bis dieses Match durchgemessen ist.
# Defaults im Code sind beide 0 (verhaltensgleich zur Step-1-Bewertung).
knight_pawn_scale = 2
bishop_pawn_scale = 2

# --- Schritt 3 der dynamischen Figurenbewertung (Bishop-Pair, 16.05.2026) ---
#
# Vorher: konstanter Bonus `2 * bishop_pair_each = 30 cp` in jeder Phase.
# Jetzt: phasen-getapert, Endspiel-Pol zusaetzlich nach Brett-Offenheit
# moduliert. Formel in `evaluate_side`:
#
#   eg_value = bishop_pair_eg + (16 - total_pawn_count) * bp_open_scale
#   bonus    = taper(bishop_pair_mg, eg_value, phase)
#
# Variante A (Tobias' Wahl, 16.05.2026; siehe docs/dynmat-step3.md):
#   - MG-Verhalten unveraendert (=30 cp wie bisher)
#   - EG-Basis +20 cp (50 statt 30)
#   - Offenheits-Skala: pro fehlendem Bauer +2 cp im EG-Pol
#     volle Brett-Bauern (16) → EG-Bonus 50; leere Bauern → EG-Bonus 82
# Defaults im Code 30/30/0 → identisch zu altem 2 * bishop_pair_each
# (Anker-Konsistenz mit Step-1-Pattern).
bishop_pair_mg = 30
bishop_pair_eg = 50
bp_open_scale  = 2

[imbalance]
# Material-Ungleichgewicht "2 Leichtfiguren vs Turm(+Bauer)" (Diagnose 31.05.2026,
# docs/see.md Root-Cause-Abschnitt). Befund: Martuni bewertete Turm+Bauer ≈
# Springer+Laeufer (material-Diff nur ~15 cp) und ging deshalb willentlich
# Opfer wie Nxf7 Rxf7 Bxf7+ Qxf7 ein, die in einer -300-Stellung enden (SF d26),
# die Martuni statisch als ~ausgeglichen sah. Reines Stueckwert-Zaehlen erfasst
# nicht, dass zwei aktive Leichtfiguren im Mittelspiel mehr wiegen als R+P.
#
# Wirkung (eval::material_imbalance): loest nur beim klassischen Muster aus —
# eine Seite hat >= 2 Leichtfiguren mehr UND >= 1 Turm weniger. Bonus geht an
# die Leichtfiguren-Mehrheits-Seite, phase-getapert (MG > EG: zwei Minor mit
# Damen am Brett gefaehrlicher). Zum Kippen der Zugwahl genuegen ~30-50 cp;
# 80 cp korrigiert spuerbar, ohne die vollen ~290 cp zu uebernehmen (Bishop-Pair
# und Mobility fangen einen Teil schon). Validierung ueber >300 Lichess-Partien
# (kein fastchess-A/B). Defaults im Code 0/0 → ohne diese Sektion inaktiv.
two_minors_mg = 80
two_minors_eg = 80

[outpost]
# Knight-Outpost-Bonus (Diagnose 05.06.2026, docs/roadmap.md). Befund: die
# "motivlosen" Mittelspiel-Drops (50 % aller Blunder) sind real (78 % halten
# bei SF d26) und entstehen durch Figuren-Passivitaet bei materiellem
# Gleichstand/Vorteil — Martunis Eval ist dort ~300 cp zu optimistisch. Weder
# PST (statisch pro Feld) noch Safe-Mobility (zaehlt nur Zielfelder) erfassen
# einen unvertreibbaren Springer.
#
# Wirkung (eval::is_knight_outpost): Bonus fuer einen eigenen Springer auf der
# 4.-6. Reihe, der von einem eigenen Bauern gedeckt ist UND von keinem
# gegnerischen Bauern je angegriffen werden kann ("Loch"). Phase-getapert
# (MG > EG). Code-Default 0/0 → ohne aktive Werte inaktiv (verhaltensgleich).
#
# STATUS: A/B verworfen (06.06.2026). Standalone-A/B 25/15 vs imbalance_8080
# (matches/baseline_vs_outpost, 1000 Partien): outpost -10.77 Elo +/- 17.33,
# LOS 88.89 % ZUGUNSTEN baseline, Pentanomial [57,64,243,63,73] (WW73>LL57 fuer
# baseline). CI deckt Null, aber Richtung klar gegen den Term — deckt sich mit
# frueherem negativem Outpost-Gate (05.06.). Kein Rollout. Term dormant auf 0/0
# (Code bleibt im Tree, verhaltensgleich zur Produktion).
knight_mg = 0
knight_eg = 0

[pawns]
# Isolani: Bauer ohne eigene Bauern auf benachbarten Linien
# Finding: -20 ist ein flacher Malus. Im Endspiel sind isolierte Bauern oft
# gravierender, im Mittelspiel mit Figurenspiel manchmal harmloser. Richtung:
# spaeter phase-getapert oder mit Aktivitaetskompensation testen.
isolated_penalty = -20

# Positionsboni nach Linie (gelten unabhaengig von der Reihe)
# Finding: Zentralboni sind blind fuer Blockade, Rueckstaendigkeit und Deckung.
# Falls die Engine zu optimistisch zentrale Bauern vorschiebt, eher absenken
# oder an Fortschritt/Unterstuetzung koppeln.
de_file_bonus = 10
cf_file_bonus = 5

# Phalanx: mehrere eigene Bauern nebeneinander auf derselben Reihe.
# Bei 4+ zaehlt der 3er-Bonus einmal.
# Finding: Die Phalanx wird nur nach Breite bewertet. Das kann unbewegliche
# oder angreifbare Bauernketten ueberzahlen. Richtung: Bonus nur fuer mobile
# oder gedeckte Phalanx staerken; blockierte Phalanx abschwaechen.
phalanx_triple = 30
phalanx_double = 15

# Freibauer-Bonus pro Vormarsch-Rang.
# KORREKTUR 29.05.: Der A/B 27.05. (gate700_vs_passed_pawn_v1, 1000 Partien)
# wurde fehl-attribuiert. fastchess: "Results of Baseline vs PassedPawnV1 …
# Elo: +20.17 ±17.69, LOS 98.75 %, Wins 463 / Losses 405" = +20 Elo fuer
# die ALTEN Werte [5,15,30,55,100,170] (Baseline), nicht fuer den Raise
# [5,15,35,70,150,300] (PassedPawnV1). Der Raise ist ~-20 Elo => zurueck
# auf den bewaehrten Default. (pQ8INwpS-7th-rank-Motivation bleibt offen
# fuer einen milderen, sauber getesteten Bump.)
passed_rank_bonuses = [5, 15, 30, 55, 100, 170]

[pieces]
# Springer auf Reihe 1 oder 8 steht schlecht
# Finding: -50 ist harter Entwicklungsdruck. Gut gegen passive Springer, aber
# manchmal zu streng fuer legitime Verteidiger/Umgruppierungen. Richtung: bei
# fruehen taktischen Fehlern oder Rand-Ausweichzuegen eher milder testen.
knight_backrank_penalty = -50

# Entwicklungs-Malus: Laeufer auf der EIGENEN Grundreihe, nur MG-Pol
# (taper(x, 0, phase)). Eingefuehrt nach dem 960-Lookback 26.07.2026:
# ohne Buch fehlte jeder Entwicklungsdruck, Martuni driftete in der
# Eroeffnung still ab (66 Opening-Blunder in 960 vs. 5 im Standard).
# Milder als der Springer-Malus (der ist flat -50 und phasenlos), weil
# Laeufer auf der Grundreihe oefter legitim stehen (Fianchetto-Vorstufe).
bishop_backrank_penalty_mg = -20

# Laeuferpaar: solange beide Laeufer vorhanden sind, erhaelt jeder Laeufer
# diesen Bonus (gesamt also +2 * bishop_pair_each)
# Finding: Gesamt +30 ist plausibel. Der bessere Hebel ist dynamisch:
# staerker bei offenem Brett/wenigen Bauern, schwaecher bei blockiertem Zentrum.
bishop_pair_each = 15

# Verbundene Tuerme (gleiche Linie/Reihe, Sichtverbindung, nichts dazwischen):
# einmaliger Bonus fuer das Paar
# Finding (15.05.2026): A/B 150 vs 30 ueber fastchess (SPRT, 5+0.05, UHO):
# CR150 -150.65 Elo +/-41.14 nach 240 Partien, LOS 0 %, H0 akzeptiert.
# Eval-Audit auf den Cluster-1b-Stellungen (W5AboGf0, 54iwUiMx) hatte den
# 150-Wert als 92-99 % Bias-Treiber gegen Stockfish d1 identifiziert.
# Aktion: Reduktion auf 30 (industriestandard 10-40 cp).
connected_rooks_pair = 30

# Turm auf offener Linie (keine Bauern beider Seiten auf der Linie)
# Finding: 30/15 fuer offene Linien ist solide, aber aktuell ziellos: ein Turm
# auf leerer offener Linie zaehlt wie ein aktiver Turm. Richtung: an Zielbauer,
# 7. Reihe, Koenigszugang oder Verdopplung koppeln.
rook_open_file_bonus = 30

# Turm auf halb-offener Linie (keine eigenen, aber gegnerische Bauern)
rook_semiopen_file_bonus = 15

# Tarrasch-Regel: Turm gehört hinter den Freibauer. Wirkt pro
# Turm-Freibauer-Paar auf derselben Linie (eigener oder gegnerischer Bauer).
# Hinter eigenem Freibauer = Turm schiebt.
# Finding: Diese Tarrasch-Werte sind bewusst klein. Bei Problemen gegen
# gegnerische Freibauern eher Blockade/`rook_behind_enemy_passed_bonus`
# staerken, nicht pauschal alle Turmwerte hochziehen.
rook_behind_own_passed_bonus = 15
# Hinter gegnerischem Freibauer = Blockade von hinten (etwas stärker, weil
# der Gegner den Bauer nicht mehr bewegen kann, ohne den Turm zu tauschen).
rook_behind_enemy_passed_bonus = 20
# Turm VOR eigenem Freibauer → blockt den eigenen Vormarsch (kleiner Malus).
rook_blocks_own_passed_penalty = -10

# Turm auf 7. Reihe aus eigener Sicht (Reihe 7 Weiß, Reihe 2 Schwarz).
# Finding: +15/+15 ist moderat. Wenn Invasionen auf der 7. Reihe verpasst
# werden, eher Zusatzbedingungen fuer angegriffene Bauern/Koenigsschnitt
# ausbauen, statt den Basiswert blind stark zu erhoehen.
rook_seventh_bonus = 15
# Extra-Bonus, wenn der gegnerische König auf der 8. (Grund-)Reihe steht —
# der Turm schneidet eine Fluchtlinie ab ("pig on the seventh").
rook_seventh_vs_king_eighth_bonus = 15

# Endspiel-Malus für einen Turm, der direkt hinter einem eigenen Bauern
# (Heimreihe oder zweite Reihe + eigener Bauer eine Reihe weiter vorn auf
# gleicher Linie) eingemauert sitzt. Phase-getapert: voller Effekt im reinen
# Endspiel, 0 im vollen Mittelspiel.
# Finding: -10 ist sehr mild. Bei passiven Turmendspielen Richtung -20..-40
# testen, aber die Endspiel-Taperung beibehalten.
rook_trapped_endgame_penalty = -10

[king_safety]
# Gewichte je gegnerischer Figur, die die 3x3-King-Zone angreift.
# Bauern und der gegnerische Koenig zaehlen nicht.
# Finding: King-Safety ist nach den Reports ein grosser Hebel
# (Mattmotive/entgegengesetzte Rochaden). Einzelangreifer kosten wenig;
# bei unterschaetzten Angriffen queen/rook weights oder die fruehe
# SafetyTable-Kurve vorsichtig erhoehen.
knight_weight = 2
bishop_weight = 2
rook_weight   = 3
queen_weight  = 5

# König-Expositions-Strafe (cp pro Expositions-Punkt). Greift bei
# rank_dist >= 3 vom Heimrand UND enemy_npm >= 1500cp UND wird zusätzlich
# phase-getapert (0 im reinen Endspiel, voll bei phase >= 16).
# Finding: Dieser Term wurde bereits entschaerft. Nur erhoehen, wenn Koenige
# im Mittelspiel weiter ins Feuer laufen; bei zu passiver Endspiel-Koenigfuehrung
# eher niedrig lassen.
exposure_weight = 12

# Pawn Shield — 3-Linien-Fenster auf der Koenigsseite (a-c bei lang
# rochiert, f-h bei kurz rochiert).
# Je Linie: Bauer direkt vor dem Koenig = voller Bonus; bereits vorgerueckt
# (zwei Reihen vor dem Koenig) = abgeschwaechter Bonus; kein Bauer = Strafe.
# Finding: Shield wirkt laut Code nur, solange der Koenig auf der Grundreihe
# steht. -15 je fehlendem Bauern ist moderat; bei Rochade-Angriffen fehlenden
# Schild eher staerker bestrafen. Das "Koenig ein Feld gelaufen"-Problem ist
# eher ein Eval-Feature als eine reine TOML-Stellschraube.
shield_rank1_bonus    =  10
shield_rank2_bonus    =   5
shield_missing_penalty = -15

# Koenig auf d/e-Linie ohne Rochade → offenes Zentrum
# Finding: -30 ist mild fuer einen unrochierten Koenig im Zentrum. Bei
# Eroeffnungsproblemen mit Koenig auf d/e eher Richtung -40/-60 testen,
# idealerweise material- oder phase-abhaengig.
exposed_center_penalty = -30

# Koenig auf a- oder f-Linie der Heimreihe (bisher neutral 0): dorthin
# kommt er nur ohne bzw. nach verspielter Rochade. 960-Lookback 26.07.2026:
# exposed_king war Blunder-Motiv #2 (53x), Rochadequote nur 46 % vs. 65 %
# im Standard. Milder als exposed_center (-30), da die Flanke gedeckter ist.
uncastled_flank_penalty = -25

# Rochade-Anreiz: MG-Malus solange die Seite noch Rochaderechte hat —
# Rochieren loescht die Rechte und "verdient" den Betrag als Tempo-Bonus.
# Symmetrisch am Partieanfang (beide Seiten -15), wirkt also erst als
# Differenz, sobald eine Seite rochiert hat. 960-Lookback 26.07.2026:
# Martuni rochierte im Schnitt erst Zug 18.8 (Standard: 11.0).
castle_rights_penalty_mg = -15

# SafetyTable: non-lineare Zuordnung Angriffsscore → Strafe in cp.
# Index = min(n_angreifer * summe_der_gewichte, 99).
# Kurve nach Chess Programming Wiki, kappt bei 500 cp (5 Bauern).
# Finding: Feinster Hebel ist nicht das Cap, sondern die Steigung bei Index
# 8-30, wo typische Dame+Leichtfigur/Turm-Angriffe landen. Bei uebersehenen
# Mattnetzen dort steiler machen; Cap 500 erst zuletzt anfassen.
safety_table = [
    0,   0,   1,   2,   3,   5,   7,   9,  12,  15,
   18,  22,  26,  30,  35,  39,  44,  50,  56,  62,
   68,  75,  82,  85,  89,  97, 105, 113, 122, 131,
  140, 150, 169, 180, 191, 202, 213, 225, 237, 248,
  260, 272, 283, 295, 307, 319, 330, 342, 354, 366,
  377, 389, 401, 412, 424, 436, 448, 459, 471, 483,
  494, 500, 500, 500, 500, 500, 500, 500, 500, 500,
  500, 500, 500, 500, 500, 500, 500, 500, 500, 500,
  500, 500, 500, 500, 500, 500, 500, 500, 500, 500,
  500, 500, 500, 500, 500, 500, 500, 500, 500, 500,
]

[endgame]
# Hand-codiertes Endspielwissen ohne Tablebases.
# Greift nur, wenn Material-Signatur erkannt wird (KRvK, KQvK, KRRvK,
# KQQvK, KPK, KBNK). Sonst laeuft die normale Eval.

# Mop-up: Gradient, der den schwaecheren Koenig in die Ecke zieht
# und den staerkeren Koenig heranfuehrt.
# Maximaler Beitrag pro Term: 7 * corner_weight bzw. 14 * king_weight.
# Finding: Wenn technische Gewinne wie KRvK/KQvK zu langsam konvertieren,
# corner/proximity leicht erhoehen. Wenn die Eval in Materialvorteil-Endspielen
# zu optimistisch wird, eher senken.
corner_weight         = 20
king_proximity_weight = 10

# KPK Rule of the Square: wenn der Bauer nicht mehr einholbar ist,
# wird er sicher zur Dame. Bonus on top des Bauernmaterials.
# Finding: +500 ist stark, aber fuer sichere Umwandlung plausibel. Bei falschen
# "unaufhaltbar"-Urteilen zuerst die Erkennung/Tempo-Logik pruefen, nicht nur
# den Wert senken.
passed_unstoppable_bonus = 500

# Aktiver Endspielkoenig: Bonus pro Zentralisierungseinheit (0=Ecke, 7=Zentrum),
# skaliert mit dem Endspielgrad. Wirkt nur wenn Phase < threshold.
# Maximalbonus (Zentrum vs. Ecke, Phase=0): 7 * 3 = 21 cp
# Finding: Maximal +21 cp ist zurueckhaltend. Bei passiven Koenigen in
# Endspielen Richtung 4-6 testen oder die Phase-Schwelle pruefen; bei
# Mittelspiel-Koenigsausfluegen nicht erhoehen.
king_activity_bonus = 3
king_activity_phase_threshold = 16

# König-Freibauer-Synergie (Endspielterm). Wirkt wie king_activity nur unter
# der Phase-Schwelle und skaliert mit (threshold - phase) / threshold.
# Pro eigenem Freibauer: Bonus = (7 - chebyshev(König, Bauer)) * near_own_bonus.
# Pro gegnerischem Freibauer (König als Blocker): analog mit near_enemy_bonus.
# Max pro Bauer und Seite: 7 * bonus * (phase_weight=1) = 14 bzw. 21 cp.
# Finding: Defensive Blockade ist bewusst staerker als eigene Begleitung.
# Bei Problemen gegen gegnerische Freibauern zuerst near_enemy erhoehen;
# bei fehlendem eigenen Gegenspiel near_own anheben.
king_near_own_passed_bonus = 2
king_near_enemy_passed_bonus = 3

[mobility]
# Safe-Mobility: cp pro legalem Zielfeld, das nicht von eigener Figur
# besetzt und nicht von einem gegnerischen Bauern angegriffen ist.
# Werte werden getapert (mg im Mittelspiel, eg im Endspiel).
#
# Max-Zuege je Figur:  Knight 8, Bishop 13, Rook 14, Queen 27.
# Mit den Default-Werten liegt die Mobility-Summe einer Seite in
# wilden Stellungen bei ca. 100-120 cp (mg) — spuerbar, aber deutlich
# unter Figurenwerten.
#
# Bauern und Koenig werden bewusst NICHT bewertet: Bauern decken PST +
# Freibauer-Bonus, Koenig deckt king_safety + king_activity_endgame.
# Finding: Safe-Mobility ignoriert nur gegnerische Bauernangriffe, nicht
# Fesselungen, taktische Pins oder Slider-Kontrolle. Werte klein halten und
# nur in kleinen Schritten aendern.
# Finding: Springer MG=EG gleich. Bei passiven Springern leicht MG erhoehen
# oder besser ein Outpost-Feature ergaenzen.
knight_mg = 3
knight_eg = 3
# Finding: Laeufer profitieren im Endspiel etwas mehr. Bei offenen Stellungen
# eher hier oder beim dynamischen Laeuferpaar nachschaerfen.
bishop_mg = 3
bishop_eg = 4
# Finding: Turm-EG=5 ist ein starker Endspiel-Hebel. Gut fuer aktive
# Turmendspiele, aber bei kosmetischer Aktivitaet/offenen Linien ggf. senken.
rook_mg   = 2
rook_eg   = 5
# Finding: Niedrige Damenmobilitaet verhindert, dass fruehe Damenausfluege
# ueberbelohnt werden. Nur erhoehen, wenn die Dame dauerhaft zu passiv bleibt.
queen_mg  = 1
queen_eg  = 2
# Staffel-Malus fuer vergrabene Leichtfiguren (960-Lookback 11.08.2026):
# Liste wird mit der Safe-Feld-Anzahl der Figur indiziert (Index 0 = ganz
# eingemauert), wirkt nur im MG-Pol, nur Springer/Laeufer. Fehlender Key /
# leere Liste = Term inaktiv (bit-exakt). AKTIV seit 11.08.2026 (FRC-A/B +28.4, Standard-Gate neutral):
minor_low_mob_penalty_mg = [-30, -20, -10]

[endgame_guard]
# Pawn-Endgame-Guard (23.05.2026, docs/pawn-endgame-guard.md). Drei klassische
# Pawn-Endgame-Konzepte fuer einfache Endspiele:
#   1. Opposition (direkt + diagonal): Bonus, wenn der eigene Koenig die
#      Opposition haelt (gleiche Linie/Reihe/Diagonale, ungerade Anzahl
#      freier Felder, Gegner am Zug). "Wer-zieht-verliert"-Konstellation.
#   2. Key Squares: Bonus pro eigenem Freibauer, wenn der eigene Koenig
#      auf einem der drei Schluesselfelder steht. Rang-abhaengig.
#   3. Rook-Pawn-Edge: Daempfung des Passbauer-Optimismus, wenn unser
#      einziger Frei-Bauer auf a/h steht und der gegnerische Koenig die
#      Promo-Ecke bereits kontrolliert.
#
# Hartes NPM-Gate (npm_endgame_gate=300): beide Seiten muessen mit ihrem
# Offizier-Material darunter liegen, sonst inaktiv. Zusaetzlich Phase-
# Tapering analog king_passed_pawn_synergy (voller Effekt bei phase=0,
# linear gegen 0 ab king_activity_phase_threshold=16).
#
# Defaults im Code sind alle 0 (Gate ausgenommen), d.h. ohne diese Sektion
# verhaelt sich die Engine identisch zur Pre-Guard-Version.

# Konsistent mit pawn_de_file_bonus=10. Klein, weil Opposition nur indirekt
# zum Vorteil fuehrt — sie ist Vorbote eines Gewinn-Plans, nicht selbst
# der Plan. Pro Halbzug-Wechsel kippt der Bonus zwischen +12 und -12;
# Diff 24cp ist genug fuer Such-Signal, klein genug, dass der Term das
# EG nicht dominiert.
opposition_bonus = 12

# Bonus, wenn unser Koenig auf einem Schluesselfeld eines eigenen
# Freibauern steht. Index = Bauer-Rang aus eigener Sicht (1..8):
#   Rang 2 (Index 1): 0   — Bauer auf Startreihe, KS auf Rang 4 sehr frueh
#   Rang 3 (Index 2): 10  — beginnt zu zaehlen
#   Rang 4 (Index 3): 18
#   Rang 5 (Index 4): 28  — Uebergang
#   Rang 6 (Index 5): 40  — klarer Gewinn-Indikator
#   Rang 7 (Index 6): 30  — Bauer hat eh viel passed-rank-Bonus (170 cp)
#   Rang 8 (Index 7): 0   — Bauer ist Dame
# Groessenordnung ≈ 1/3 von pawn_passed_rank_bonuses an derselben Stufe.
key_square_bonus_by_rank = [0, 0, 10, 18, 28, 40, 30, 0]

# Reduziert den Passbauer-Bonus, wenn der eigene Frei-Bauer auf a/h steht
# UND der gegnerische Koenig die Promo-Ecke kontrolliert (Chebyshev ≤ 1).
# -60 cp: bei Bauer auf Rang 5 (Passbauer-Bonus +100 cp) bleibt 40 cp
# Vorteil — der Bauer hat einen Materialwert, ist aber kein Gewinn-
# Indikator mehr.
rook_pawn_drawish_penalty = -60

# Hardes NPM-Gate. Beide Seiten muessen mit Offizier-Material <= Gate
# liegen, sonst ist der Term komplett inaktiv. 300 cp = bis 1 Leichtfigur
# (N oder B) pro Seite. Klassische Bauernendspiel-Heuristiken (Opposition,
# Key Squares, Rook-Pawn-Edge) sollen nur dort wirken, wo das Bauernspiel
# das Endspiel dominiert — KR-vs-KR oder K+2 Leichte verfaelschen sie.
#
# 27.05.2026: zurueck auf 700. Das 300er-Gate (25.05.) war A/B-negativ
# (-2.43 Elo) und korreliert mit einer Rapid-Regression von -54 Elo
# (Anker 24.05. 2126 → 27.05. 2072). Rapid-Partien haben hoehere
# Endspiel-Dichte; bei 300er-Gate lagen zu viele relevante KN/KB-
# Endspiele ausserhalb des Guards.
npm_endgame_gate = 700

[damping]
# Material-Defizit-Daempfung der Kompensations-Terme (Diagnose 06.06.2026,
# Bxe4-Bug, docs/roadmap.md). Liegt eine Seite statisch >= deficit_threshold cp
# zurueck, werden IHR Freibauer-Vormarschbonus (passed_pct %) und ihr positiver
# PST-eg-Ueberschuss (pst_eg_pct %) gekuerzt — vorgeschobene Bauern und gute
# Felder sind weniger wert, wenn der Gegner eine Mehrfigur zum Blockieren/Schlagen
# hat. baseline imbalance_8080 kennt diese Sektion nicht und ignoriert sie.
# A/B-Kandidat 06.06.: 50/50 ab 200 cp. Prozentsaetze 100 = inaktiv.
deficit_threshold = 200
passed_pct = 50
pst_eg_pct = 50
